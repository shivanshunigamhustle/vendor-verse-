# Render Blueprint: one static site per app, each built from its own folder.
services:
  - type: web
    runtime: static
    name: vendorverse-web
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
  - type: web
    runtime: static
    name: vendorverse-mobile
    rootDir: mobile
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
