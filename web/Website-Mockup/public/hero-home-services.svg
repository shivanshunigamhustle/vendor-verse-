    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a37a"/><stop offset="1" stop-color="#b57a54"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd6e4"/><stop offset="1" stop-color="#f6efe2"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".93"/><stop offset="1" stop-color="#f3f5ef" stop-opacity=".87"/></linearGradient>
    <clipPath id="ph"><rect x="166" y="322" width="238" height="124" rx="14"/></clipPath>
