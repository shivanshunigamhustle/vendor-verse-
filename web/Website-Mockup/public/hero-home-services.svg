<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter,Arial,sans-serif" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A customer requests home renovation services, rentals and products on the app while the vendor confirms the order and delivers</title>
  <defs>
