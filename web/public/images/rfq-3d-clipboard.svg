<svg width="460" height="320" viewBox="0 0 460 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rfqGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F2742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="sheetEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04101F" flood-opacity="0.48"/>
    </filter>
  </defs>

  <!-- Subtle ambient Sky-Blue glow -->
  <ellipse cx="230" cy="160" rx="205" ry="135" fill="url(#rfqGlow)"/>

  <!-- 3D Connection Arcs from One Requirement to Multiple Vendor Nodes -->
  <path d="M188 158 C236 158, 255 68, 304 68" stroke="url(#beamGrad)" stroke-width="2.6" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.92"/>
  <path d="M192 160 C238 160, 258 160, 304 160" stroke="url(#beamGrad)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M188 162 C236 162, 255 252, 304 252" stroke="url(#beamGrad)" stroke-width="2.6" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.92"/>

  <!-- Pulse Nodes along connections -->
  <circle cx="248" cy="112" r="4.5" fill="#38BDF8"/>
  <circle cx="248" cy="112" r="9" fill="#38BDF8" opacity="0.22"/>
  <circle cx="248" cy="160" r="5" fill="#E0F2FE"/>
  <circle cx="248" cy="160" r="10" fill="#38BDF8" opacity="0.28"/>
  <circle cx="248" cy="208" r="4.5" fill="#38BDF8"/>
  <circle cx="248" cy="208" r="9" fill="#38BDF8" opacity="0.22"/>

  <!-- Central 3D Layered Requirement Document (Left) -->
  <g filter="url(#softShadow)">
    <!-- 3D Extruded Back Layer -->
    <rect x="44" y="68" width="142" height="190" rx="18" fill="#0B1E34" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Middle Depth Plate -->
    <rect x="50" y="62" width="142" height="190" rx="18" fill="url(#sheetEdge)"/>
    <!-- Front Crisp Surface -->
    <rect x="56" y="56" width="142" height="190" rx="18" fill="url(#sheetGrad)"/>

    <!-- Header Strip -->
    <rect x="74" y="76" width="52" height="14" rx="7" fill="#0284C7"/>
    <text x="100" y="86.2" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.06em">RFQ</text>
    <circle cx="174" cy="83" r="6" fill="#38BDF8" opacity="0.28"/>
    <circle cx="174" cy="83" r="2.8" fill="#0284C7"/>

    <!-- Structured Requirement Lines -->
    <rect x="74" y="106" width="104" height="9" rx="4.5" fill="#0F2742" opacity="0.88"/>
    <rect x="74" y="124" width="84" height="7" rx="3.5" fill="#47647D" opacity="0.45"/>

    <!-- Checklist items -->
    <rect x="74" y="148" width="14" height="14" rx="4" fill="#0284C7"/>
    <path d="M77.5 155 L80.2 157.7 L84.8 152.3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="151" width="76" height="7" rx="3.5" fill="#152B40" opacity="0.72"/>

    <rect x="74" y="172" width="14" height="14" rx="4" fill="#38BDF8" opacity="0.25" stroke="#0284C7" stroke-width="1.2"/>
    <rect x="96" y="175" width="66" height="7" rx="3.5" fill="#47647D" opacity="0.5"/>

    <rect x="74" y="196" width="14" height="14" rx="4" fill="#38BDF8" opacity="0.25" stroke="#0284C7" stroke-width="1.2"/>
    <rect x="96" y="199" width="74" height="7" rx="3.5" fill="#47647D" opacity="0.5"/>

    <!-- Bottom Pill -->
    <rect x="74" y="220" width="94" height="12" rx="6" fill="#0F2742"/>
    <circle cx="84" cy="226" r="3" fill="#38BDF8"/>
    <rect x="92" y="224" width="62" height="4" rx="2" fill="#E0F2FE" opacity="0.8"/>
  </g>

  <!-- Right Side 3D Supplier Response Nodes -->
  <!-- Node 1 (Top) -->
  <g filter="url(#softShadow)">
    <rect x="304" y="34" width="118" height="66" rx="14" fill="#143252" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65"/>
    <circle cx="326" cy="56" r="10" fill="#0284C7"/>
    <circle cx="326" cy="56" r="4" fill="#E0F2FE"/>
    <rect x="344" y="49" width="62" height="7" rx="3.5" fill="#FFFFFF" opacity="0.92"/>
    <rect x="344" y="61" width="46" height="5" rx="2.5" fill="#38BDF8" opacity="0.72"/>
    <rect x="316" y="77" width="88" height="9" rx="4.5" fill="#0F2742"/>
    <rect x="316" y="77" width="54" height="9" rx="4.5" fill="#38BDF8" opacity="0.82"/>
  </g>

  <!-- Node 2 (Middle Highlighted Match) -->
  <g filter="url(#softShadow)">
    <rect x="304" y="127" width="122" height="68" rx="14" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="326" cy="149" r="10" fill="#0284C7"/>
    <path d="M322.2 149.2 L325 152 L330 146.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="344" y="142" width="68" height="7.5" rx="3.75" fill="#0F2742"/>
    <rect x="344" y="155" width="48" height="5.5" rx="2.75" fill="#0284C7"/>
    <rect x="316" y="172" width="96" height="9" rx="4.5" fill="#E0F2FE"/>
    <rect x="316" y="172" width="68" height="9" rx="4.5" fill="#0284C7"/>
  </g>

  <!-- Node 3 (Bottom) -->
  <g filter="url(#softShadow)">
    <rect x="304" y="220" width="118" height="66" rx="14" fill="#143252" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.65"/>
    <circle cx="326" cy="242" r="10" fill="#0284C7"/>
    <circle cx="326" cy="242" r="4" fill="#E0F2FE"/>
    <rect x="344" y="235" width="60" height="7" rx="3.5" fill="#FFFFFF" opacity="0.92"/>
    <rect x="344" y="247" width="42" height="5" rx="2.5" fill="#38BDF8" opacity="0.72"/>
    <rect x="316" y="263" width="88" height="9" rx="4.5" fill="#0F2742"/>
    <rect x="316" y="263" width="46" height="9" rx="4.5" fill="#38BDF8" opacity="0.75"/>
  </g>
</svg>
