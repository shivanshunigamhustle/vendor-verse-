<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · VendorVerse</title>
<meta name="description" content="Sign in to VendorVerse.">
<style>
:root{
  --sky1:#bfe6ff; --sky2:#eaf8ff; --sky3:#fff6e0;
  --hill-back-a:#c3e36b; --hill-back-b:#a5d352;
  --hill-front-a:#8fcf4a; --hill-front-b:#6bb73b;
  --bush-a:#6dbf45; --bush-b:#4b9a30; --bush-hi:#93d35f;
  --grass:#3f8f2a;
  --card:rgba(255,255,255,.86); --card-border:rgba(20,20,40,.08);
  --card-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 60px -20px rgba(40,70,20,.35),0 8px 20px -8px rgba(20,20,40,.18);
  --fg:#0c0c14; --muted:#5d6070; --line:rgba(20,20,40,.12);
  --field:#fff; --field-border:#cfe6f5; --field-hover:#9ccbe8;
  --ring:rgba(2,132,199,.24); --ring-solid:#0284c7;
  --primary:#0284c7; --primary-hover:#0275b0; --primary-fg:#fff;
  --tabs:#eaf5fc; --tabs-border:#cfe6f5;
  --panel:linear-gradient(180deg,#f3faff,#e8f4fd); --panel-border:rgba(2,132,199,.22); --label:#475569;
  --err:#dc2626; --ok:#15803d; --info:#475069;
  --sun:1; --moon:0; --stars:0; --cloud:#fff; --cloud-o:.95;
  --rock-a:#a9a8cf; --rock-b:#8584ad;
  --wood-a:#d28a4a; --wood-b:#a8602c;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --sky1:#0a1030; --sky2:#1a2257; --sky3:#3a2f6b;
  --hill-back-a:#2c6b52; --hill-back-b:#1f5642;
  --hill-front-a:#1f5a3a; --hill-front-b:#144530;
  --bush-a:#256b3e; --bush-b:#174f2c; --bush-hi:#39905a;
  --grass:#2c7a46;
  --card:rgba(22,24,40,.82); --card-border:rgba(255,255,255,.09);
  --card-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 70px -20px rgba(0,0,0,.65),0 8px 20px -8px rgba(0,0,0,.5);
  --fg:#f4f5fb; --muted:#a2a6bd; --line:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.05); --field-border:rgba(255,255,255,.16); --field-hover:rgba(255,255,255,.3);
  --ring:rgba(56,169,232,.32); --ring-solid:#38a9e8;
  --primary:#38a9e8; --primary-hover:#5bbcf0; --primary-fg:#04141f;
  --tabs:rgba(255,255,255,.06); --tabs-border:rgba(255,255,255,.14);
  --panel:linear-gradient(180deg,rgba(56,169,232,.12),rgba(56,169,232,.05)); --panel-border:rgba(125,200,245,.24); --label:#b6c3d6;
  --err:#fb7185; --ok:#4ade80; --info:#a2a6bd;
  --sun:0; --moon:1; --stars:1; --cloud:#5b64a8; --cloud-o:.28;
  --rock-a:#5d5c86; --rock-b:#44436a;
  --wood-a:#8a5a38; --wood-b:#5f3b20;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:"Google Sans","Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--fg); background:var(--sky1); overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}

/* ───────── Sky ───────── */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  transition:background 1s ease}
.sky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a1030,#1a2257 55%,#3a2f6b);opacity:var(--stars);transition:opacity 1s ease}
:root:not([data-theme="dark"]) .sky::after{opacity:0}
.sun,.moon{position:absolute;top:9%;border-radius:50%;z-index:1;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.sun{left:10%;width:92px;height:92px;opacity:var(--sun);
  background:radial-gradient(circle at 40% 38%,#fff9c4,#ffd84d 60%,#ffb703);
  box-shadow:0 0 0 18px rgba(255,214,77,.18),0 0 0 44px rgba(255,214,77,.1),0 0 120px 40px rgba(255,200,60,.35);
  animation:sunpulse 6s ease-in-out infinite}
:root[data-theme="dark"] .sun{transform:translateY(120px) scale(.7)}
.moon{right:12%;width:74px;height:74px;opacity:var(--moon);z-index:1;
  background:radial-gradient(circle at 35% 35%,#fffdf2,#e6e8f5 70%);
  box-shadow:0 0 50px 12px rgba(200,210,255,.35);transform:translateY(-120px)}
:root[data-theme="dark"] .moon{transform:none}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(150,160,200,.35)}
.moon::before{width:16px;height:16px;left:16px;top:18px}
.moon::after{width:10px;height:10px;right:16px;bottom:16px}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity 1s ease;z-index:1}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
.cloud{position:absolute;left:0;z-index:1;width:var(--w);opacity:var(--cloud-o);color:var(--cloud);
  animation:drift var(--t) linear infinite;animation-delay:var(--dl);transition:opacity 1s,color 1s;filter:drop-shadow(0 8px 14px rgba(70,120,170,.12))}
.cloud svg{display:block;width:100%;fill:currentColor}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
@keyframes sunpulse{50%{box-shadow:0 0 0 24px rgba(255,214,77,.16),0 0 0 54px rgba(255,214,77,.08),0 0 140px 54px rgba(255,200,60,.4)}}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}

/* ───────── Meadow ───────── */
.scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:min(46vh,430px);z-index:1;pointer-events:none;display:block}
.scene .hb{fill:url(#gBack)} .scene .hf{fill:url(#gFront)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--s,4s) ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.rise-scene{animation:sceneIn 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes sceneIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* ───────── Stage ───────── */
.theme{position:fixed;top:16px;right:16px;z-index:10;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--card-border);background:var(--card);color:var(--fg);cursor:pointer;display:grid;place-items:center;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px -8px rgba(0,0,0,.3);transition:transform .25s,background .3s}
.theme:hover{transform:rotate(18deg) scale(1.06)}
.theme:focus-visible{outline:3px solid var(--ring-solid);outline-offset:2px}
.theme svg{width:20px;height:20px;position:absolute;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.theme .i-moon{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .theme .i-sun{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme="dark"] .theme .i-moon{opacity:1;transform:none}

.stage{position:relative;z-index:2;min-height:100%;display:flex;justify-content:center;align-items:center;padding:200px 16px 60px}
.wrap{position:relative;width:min(420px,100%)}

/* Mascot */
.mascot{position:absolute;left:50%;bottom:calc(100% - 3px);width:200px;height:auto;margin-left:-100px;overflow:hidden;z-index:2;
  animation:pop .9s .25s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:translateY(60px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.mascot *{stroke-linecap:round;stroke-linejoin:round}
.ol{stroke:#6b3410;stroke-width:2.2}
#head{transform-origin:100px 112px;transition:transform .22s ease-out}
.pupil{transition:transform .14s ease-out}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.eye.r{animation-delay:.04s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ear{animation:ear 4.5s ease-in-out infinite}
.ear.l{transform-origin:62px 58px}.ear.r{transform-origin:138px 58px;animation-delay:.6s}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.ear.r{animation-name:earR}
@keyframes earR{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
#bob{animation:bob 3.6s ease-in-out infinite;transform-origin:100px 170px}
@keyframes bob{50%{transform:translateY(-2px) scale(1.01,.99)}}
.rest-paws{transition:transform .4s cubic-bezier(.3,1.2,.5,1)}
.cover-paws{transform:translateY(100px);transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.pads{transition:opacity .25s .1s}
.covering .cover-paws{transform:translateY(0)}
.covering .rest-paws{transform:translateY(46px)}
.peeking .cover-paws{transform:translateY(30px)}
.mouth-sad,.mouth-open{opacity:0}
.sad .mouth-happy{opacity:0}.sad .mouth-sad{opacity:1}
.sad .eye{animation:none;transform:scaleY(.8)}
.sad #head{animation:headshake .6s}
.sad .tear{opacity:1}
.tear{opacity:0;transition:opacity .3s}
.happy #bob{animation:hop .7s cubic-bezier(.3,1.4,.5,1) 2}
.happy .mouth-happy{opacity:0}.happy .mouth-open{opacity:1}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes headshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* Card */
.card{position:relative;padding:34px 28px 26px;border-radius:30px;background:var(--card);border:1px solid var(--card-border);box-shadow:var(--card-shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  animation:cardIn .9s cubic-bezier(.2,.7,.2,1) both;transition:background .5s,border-color .5s}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.card.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

header{text-align:center;margin-bottom:20px}
h1{font-size:1.6rem;line-height:1.15;font-weight:700;letter-spacing:-.03em}
h1 .w{display:inline-block;white-space:nowrap}
h1 .w + .w{margin-left:.27em}
h1 .l{display:inline-block;opacity:0;transform:translateY(14px) scale(.9);filter:blur(8px);
  animation:letter .85s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:calc(.55s + var(--i)*45ms)}
@keyframes letter{60%{filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}
h1 .brand .l{color:var(--c)}
.sub{margin-top:8px;font-size:.92rem;color:var(--muted)}
.fade{opacity:0;transform:translateY(10px);animation:fade .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,1s)}
@keyframes fade{to{opacity:1;transform:none}}

.soc:focus-visible,.btn:focus-visible,a:focus-visible,.tab:focus-visible,.ws:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--ring-solid);outline-offset:2px}

/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--tabs);border:1px solid var(--tabs-border);border-radius:14px;margin-bottom:18px}
.tab{height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.93rem;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--field);color:var(--primary);box-shadow:0 2px 8px -2px rgba(2,100,160,.3)}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:rgba(255,255,255,.1)}

.group{margin-bottom:14px}
label.lbl{display:block;font-size:.92rem;font-weight:500;margin-bottom:7px}
.hint{margin-top:8px;font-size:.8rem;color:var(--muted)}

/* Phone */
.phone{display:flex;height:46px;background:var(--field);border:1px solid var(--field-border);border-radius:12px;overflow:hidden;transition:border-color .2s,box-shadow .25s}
.phone:hover{border-color:var(--field-hover)}
.phone:focus-within{border-color:var(--ring-solid);box-shadow:0 0 0 4px var(--ring)}
.phone[data-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 4px color-mix(in srgb,var(--err) 18%,transparent)}
.cc{border:0;border-right:1px solid var(--field-border);background:transparent;color:var(--fg);font:inherit;font-weight:700;font-size:.85rem;padding:0 6px 0 12px;cursor:pointer;outline:0;max-width:104px}
.cc option{color:#0f172a}
.phone .pi{display:flex;align-items:center;flex:1;gap:10px;padding:0 14px;min-width:0}
.phone .pi svg{width:16px;height:16px;color:var(--muted);flex:none;transition:color .2s}
.phone:focus-within .pi svg{color:var(--ring-solid)}
.phone input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:.95rem;color:var(--fg);height:100%}
.phone input::placeholder{color:var(--muted);opacity:.8}

/* Email / password fields */
.field{position:relative}
.field>svg.ic{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:color .2s}
.field input{width:100%;height:46px;padding:0 42px 0 39px;font:inherit;font-size:.95rem;color:var(--fg);background:var(--field);
  border:1px solid var(--field-border);border-radius:12px;outline:0;transition:border-color .2s,box-shadow .25s,background .3s}
.field input:hover{border-color:var(--field-hover)}
.field input:focus{border-color:var(--ring-solid);box-shadow:0 0 0 4px var(--ring)}
.field:focus-within>svg.ic{color:var(--ring-solid)}
.field input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 4px color-mix(in srgb,var(--err) 18%,transparent)}
.eyebtn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s}
.eyebtn:hover{background:var(--line);color:var(--fg)}
.eyebtn:focus-visible{outline:3px solid var(--ring-solid)}
.eyebtn svg{width:17px;height:17px;grid-area:1/1;transition:opacity .2s,transform .3s}
.eyebtn .off{opacity:0;transform:scale(.5)}
.eyebtn[aria-pressed="true"] .on{opacity:0;transform:scale(.5)}
.eyebtn[aria-pressed="true"] .off{opacity:1;transform:none}

.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;font-size:.88rem}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--field-hover);display:grid;place-items:center;background:var(--field);transition:background .2s,border-color .2s,transform .2s}
.box svg{width:11px;height:11px;stroke:var(--primary-fg);stroke-width:3;fill:none;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s .05s}
.check input:checked + .box{background:var(--primary);border-color:var(--primary)}
.check input:checked + .box svg{stroke-dashoffset:0}
.check:active .box{transform:scale(.88)}
.check input:focus-visible + .box{outline:3px solid var(--ring-solid);outline-offset:2px}
a{color:var(--primary);font-weight:700;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .3s}
a:hover{background-size:100% 1.5px}

/* Buttons */
.btn{position:relative;width:100%;height:50px;border:0;border-radius:13px;font:inherit;font-weight:700;font-size:.98rem;cursor:pointer;color:var(--primary-fg);background:var(--primary);overflow:hidden;
  transition:background .2s,transform .15s,box-shadow .25s;box-shadow:0 12px 22px -14px var(--primary)}
.btn:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn:active{transform:scale(.985)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%)}
.btn:hover::after{transform:translateX(120%);transition:transform .8s}
.btn .lab,.btn .spin,.btn .done{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .25s,transform .35s}
.btn .spin,.btn .done{opacity:0;transform:translateY(12px)}
.spin i{width:20px;height:20px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--primary-fg) 30%,transparent);border-top-color:var(--primary-fg);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn.loading .lab{opacity:0;transform:translateY(-12px)}.btn.loading .spin{opacity:1;transform:none}
.btn.ok{background:#16a34a;color:#fff}
.btn.ok .lab{opacity:0;transform:translateY(-12px)}.btn.ok .done{opacity:1;transform:none;font-weight:600}
.btn[disabled]{cursor:default}

/* OTP */
.otp-top{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;color:var(--muted)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 6px}
.otp input{height:52px;min-width:0;text-align:center;font:inherit;font-size:1.25rem;font-weight:700;color:var(--fg);background:var(--field);border:1px solid var(--field-border);border-radius:12px;outline:0;transition:border-color .2s,box-shadow .2s}
.otp input:hover{border-color:var(--field-hover)}
.otp input:focus{border-color:var(--ring-solid);box-shadow:0 0 0 4px var(--ring)}
.linkbtn{border:0;background:none;color:var(--primary);font:inherit;font-weight:700;cursor:pointer;padding:0}
.linkbtn[disabled]{color:var(--muted);cursor:default;font-weight:500}

/* Workspace */
.workspace{margin-top:18px;padding:16px;border-radius:18px;background:var(--panel);border:1px solid var(--panel-border)}
.workspace h2{font-size:.72rem;font-weight:700;letter-spacing:.09em;color:var(--label);margin-bottom:12px}
.wsgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ws{height:42px;border-radius:12px;border:1px solid var(--field-border);background:var(--field);color:var(--fg);font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s}
.ws:hover{border-color:var(--field-hover)}
.ws:active{transform:scale(.97)}
.ws[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.note{margin-top:12px;font-size:.78rem;line-height:1.45;color:var(--muted)}

.msgwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.msgwrap.show{grid-template-rows:1fr}
.msgwrap>div{overflow:hidden}
.msg{padding-top:14px;text-align:center;font-size:.88rem;opacity:0;transform:translateY(-4px);transition:opacity .3s .1s,transform .3s .1s}
.show .msg{opacity:1;transform:none}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.msg.info{color:var(--info)}
.foot{margin-top:16px;text-align:center;font-size:.92rem;color:var(--muted)}
.confetti{position:fixed;left:0;top:0;width:9px;height:14px;z-index:50;pointer-events:none;border-radius:2px;animation:conf 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

@media (max-width:480px){
  .stage{padding-top:190px}
  .card{padding:30px 18px 22px;border-radius:26px}
  .sun{left:6%;width:64px;height:64px}
  .otp{gap:6px}.otp input{height:46px}
}
@media (max-height:640px){.stage{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
}
.stage{position:fixed;inset:0;overflow-y:auto}
.theme{z-index:100}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="stars" id="stars"></div>
  <div class="sun"></div><div class="moon"></div>
  <div class="cloud" style="--w:230px;--t:95s;--dl:-30s;top:8%"><svg viewBox="0 0 220 80"><path d="M42 74a26 26 0 0 1 4-51 36 36 0 0 1 68-6 30 30 0 0 1 50 23 25 25 0 0 1-2 34z"/></svg></div>
  <div class="cloud" style="--w:150px;--t:120s;--dl:-80s;top:20%"><svg viewBox="0 0 220 80"><path d="M42 74a26 26 0 0 1 4-51 36 36 0 0 1 68-6 30 30 0 0 1 50 23 25 25 0 0 1-2 34z"/></svg></div>
  <div class="cloud" style="--w:190px;--t:140s;--dl:-10s;top:3%"><svg viewBox="0 0 220 80"><path d="M42 74a26 26 0 0 1 4-51 36 36 0 0 1 68-6 30 30 0 0 1 50 23 25 25 0 0 1-2 34z"/></svg></div>
</div>

<button class="theme" id="theme" type="button" aria-label="Toggle dark mode">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<!-- Meadow -->
<svg class="scene rise-scene" id="scene" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hill-back-a)"/><stop offset="1" style="stop-color:var(--hill-back-b)"/></linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hill-front-a)"/><stop offset="1" style="stop-color:var(--hill-front-b)"/></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--wood-a)"/><stop offset="1" style="stop-color:var(--wood-b)"/></linearGradient>
    <linearGradient id="gBush" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bush-a)"/><stop offset="1" style="stop-color:var(--bush-b)"/></linearGradient>
    <linearGradient id="gRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rock-a)"/><stop offset="1" style="stop-color:var(--rock-b)"/></linearGradient>
  </defs>
  <path class="hb" d="M0 190C220 110 430 150 660 215S1110 120 1440 175V420H0z"/>
  <!-- fence -->
  <g fill="url(#gWood)">
    <rect x="22" y="178" width="270" height="9" rx="4"/><rect x="22" y="212" width="270" height="9" rx="4"/>
    <rect x="30" y="140" width="26" height="130" rx="12"/><rect x="104" y="128" width="26" height="140" rx="12"/>
    <rect x="178" y="136" width="26" height="140" rx="12"/><rect x="252" y="150" width="26" height="130" rx="12"/>
  </g>
  <path class="hf" d="M0 262C260 205 520 245 740 300S1190 215 1440 255V420H0z"/>
  <!-- bushes -->
  <g>
    <g fill="url(#gBush)"><circle cx="48" cy="318" r="52"/><circle cx="108" cy="338" r="42"/><circle cx="18" cy="360" r="40"/></g>
    <g fill="var(--bush-hi)" opacity=".55"><circle cx="34" cy="298" r="16"/><circle cx="100" cy="324" r="11"/></g>
    <g fill="url(#gBush)"><circle cx="1396" cy="274" r="54"/><circle cx="1340" cy="306" r="40"/><circle cx="1420" cy="340" r="44"/></g>
    <g fill="var(--bush-hi)" opacity=".55"><circle cx="1384" cy="254" r="17"/><circle cx="1330" cy="292" r="11"/></g>
    <g class="sway" style="--s:5s"><path d="M1395 232q-4-30 2-52" stroke="var(--grass)" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="1398" cy="176" rx="6" ry="14" fill="var(--bush-hi)"/></g>
  </g>
  <!-- rocks -->
  <g>
    <ellipse cx="120" cy="412" rx="105" ry="56" fill="url(#gRock)"/><ellipse cx="82" cy="388" rx="38" ry="14" fill="#fff" opacity=".28"/>
    <ellipse cx="1330" cy="418" rx="92" ry="44" fill="url(#gRock)"/><ellipse cx="1350" cy="400" rx="30" ry="10" fill="#fff" opacity=".25"/>
  </g>
  <g id="grass"></g><g id="flowers"></g>
</svg>

<main class="stage">
  <div class="wrap" id="wrap">

    <!-- Mascot: an original puppy -->
    <svg class="mascot" id="mascot" viewBox="0 0 200 172" aria-hidden="true">
      <g id="bob">
        <!-- body -->
        <path class="ol" d="M58 172c0-24 12-42 42-42s42 18 42 42z" fill="#f29a35"/>
        <path d="M92 134q8 6 16 0l4 38H88z" fill="#fff7ec"/>
        <g id="head">
          <g class="ear l"><path class="ol" d="M62 56C34 38 14 62 18 96c3 22 22 30 36 18 10-9 12-30 12-46z" fill="#e57f1e"/><path d="M52 64c-14-6-24 6-22 26 2 12 10 16 17 10 6-6 7-20 5-36z" fill="#f7a5b4" opacity=".85"/></g>
          <g class="ear r"><path class="ol" d="M138 56c28-18 48 6 44 40-3 22-22 30-36 18-10-9-12-30-12-46z" fill="#e57f1e"/><path d="M148 64c14-6 24 6 22 26-2 12-10 16-17 10-6-6-7-20-5-36z" fill="#f7a5b4" opacity=".85"/></g>
          <ellipse class="ol" cx="100" cy="90" rx="54" ry="47" fill="#f7a23c"/>
          <path d="M91 44q9-8 18 0l3 36q-12 10-24 0z" fill="#fff"/>
          <ellipse cx="100" cy="112" rx="32" ry="24" fill="#fff7ec"/>
          <ellipse cx="62" cy="106" rx="11" ry="7.5" fill="#ff7f9a" opacity=".5"/><ellipse cx="138" cy="106" rx="11" ry="7.5" fill="#ff7f9a" opacity=".5"/>
          <!-- eyes -->
          <g class="eye l"><ellipse cx="78" cy="86" rx="12" ry="13.5" fill="#fff" class="ol" style="stroke-width:1.6"/>
            <g class="pupil"><ellipse cx="78" cy="87" rx="9.5" ry="11" fill="#3a1c0b"/><circle cx="74.5" cy="82" r="3.6" fill="#fff"/><circle cx="82" cy="92" r="1.8" fill="#fff"/></g></g>
          <g class="eye r"><ellipse cx="122" cy="86" rx="12" ry="13.5" fill="#fff" class="ol" style="stroke-width:1.6"/>
            <g class="pupil"><ellipse cx="122" cy="87" rx="9.5" ry="11" fill="#3a1c0b"/><circle cx="118.5" cy="82" r="3.6" fill="#fff"/><circle cx="126" cy="92" r="1.8" fill="#fff"/></g></g>
          <path class="tear" d="M70 100q-4 8 0 11 4-3 0-11z" fill="#8fd3ff"/>
          <!-- nose + mouth -->
          <path d="M92 101q8-6 16 0 0 7-8 8-8-1-8-8z" fill="#3a1c0b"/><ellipse cx="97" cy="102" rx="3" ry="1.6" fill="#fff" opacity=".6"/>
          <g class="mouth-happy"><path d="M100 109v5" stroke="#6b3410" stroke-width="2" fill="none"/><path d="M84 112q8 10 16 2 8 8 16-2" stroke="#6b3410" stroke-width="2.2" fill="none"/><path d="M93 117q7 14 14 0z" fill="#ff7f9a" stroke="#6b3410" stroke-width="1.6"/></g>
          <g class="mouth-open"><path d="M100 109v3" stroke="#6b3410" stroke-width="2" fill="none"/><path d="M82 112q18 28 36 0z" fill="#7a2a2a" stroke="#6b3410" stroke-width="2"/><path d="M92 126q8-8 16 0-8 6-16 0z" fill="#ff7f9a"/></g>
          <g class="mouth-sad"><path d="M100 109v4" stroke="#6b3410" stroke-width="2" fill="none"/><path d="M87 123q13-12 26 0" stroke="#6b3410" stroke-width="2.2" fill="none"/></g>
        </g>
        <!-- resting paws -->
        <g class="rest-paws">
          <g class="ol" fill="#fff"><ellipse cx="74" cy="166" rx="18" ry="13"/><ellipse cx="126" cy="166" rx="18" ry="13"/></g>
          <g stroke="#6b3410" stroke-width="1.6" fill="none"><path d="M68 156v8M75 155v9M82 157v7M118 157v7M125 155v9M132 156v8"/></g>
        </g>
        <!-- covering paws -->
        <g class="cover-paws">
          <g class="ol" fill="#fff"><ellipse cx="76" cy="92" rx="21" ry="26" transform="rotate(-8 76 92)"/><ellipse cx="124" cy="92" rx="21" ry="26" transform="rotate(8 124 92)"/></g>
          <g class="pads" fill="#ff8aa5">
            <g transform="rotate(-8 76 92)"><ellipse cx="76" cy="98" rx="9" ry="8"/><circle cx="64" cy="84" r="3.6"/><circle cx="71" cy="78" r="3.6"/><circle cx="81" cy="78" r="3.6"/><circle cx="88" cy="84" r="3.6"/></g>
            <g transform="rotate(8 124 92)"><ellipse cx="124" cy="98" rx="9" ry="8"/><circle cx="112" cy="84" r="3.6"/><circle cx="119" cy="78" r="3.6"/><circle cx="129" cy="78" r="3.6"/><circle cx="136" cy="84" r="3.6"/></g>
          </g>
        </g>
      </g>
    </svg>

    <section class="card" id="card">
      <header>
        <h1 id="title" aria-label="Welcome to VendorVerse">Welcome to VendorVerse</h1>
        <p class="sub fade" style="--d:1.35s">Sign in to continue to your dashboard.</p>
      </header>

      <div class="tabs fade" style="--d:1.5s" role="tablist" aria-label="Sign in method">
        <button class="tab" role="tab" id="tab-phone" aria-selected="true" aria-controls="pane-phone" type="button">Phone</button>
        <button class="tab" role="tab" id="tab-email" aria-selected="false" aria-controls="pane-email" type="button">Email</button>
      </div>

      <!-- PHONE -->
      <div class="pane fade" style="--d:1.65s" id="pane-phone" role="tabpanel" aria-labelledby="tab-phone">
        <form id="phoneForm" novalidate>
          <div id="stepPhone">
            <div class="group">
              <label class="lbl" for="mobile">Mobile number</label>
              <div class="phone" id="phoneBox">
                <select class="cc" id="cc" aria-label="Country code">
                  <option value="+91" data-len="10" selected>IN +91</option>
                  <option value="+1" data-len="10">US +1</option>
                  <option value="+44" data-len="10">UK +44</option>
                  <option value="+971" data-len="9">AE +971</option>
                  <option value="+65" data-len="8">SG +65</option>
                  <option value="+61" data-len="9">AU +61</option>
                </select>
                <div class="pi">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
                  <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="98290 00001" maxlength="14">
                </div>
              </div>
              <p class="hint">Standard SMS rates may apply</p>
            </div>
            <button class="btn" id="sendOtp" type="submit">
              <span class="lab">Send OTP</span><span class="spin"><i></i></span><span class="done">✓ OTP sent</span>
            </button>
          </div>

          <div id="stepOtp" hidden>
            <div class="otp-top">
              <span>Code sent to <strong id="sentTo"></strong></span>
              <button class="linkbtn" id="changeNum" type="button">Change</button>
            </div>
            <div class="otp" id="otp" role="group" aria-label="One-time password">
              <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
              <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>
            <div class="otp-top" style="margin:10px 0 16px">
              <span id="timer"></span>
              <button class="linkbtn" id="resend" type="button" disabled>Resend OTP</button>
            </div>
            <button class="btn" id="verify" type="button">
              <span class="lab">Verify &amp; Sign in</span><span class="spin"><i></i></span><span class="done">✓ Signed in</span>
            </button>
          </div>
        </form>
      </div>

      <!-- EMAIL -->
      <div class="pane" id="pane-email" role="tabpanel" aria-labelledby="tab-email" hidden>
        <form id="emailForm" novalidate>
          <div class="group">
            <label class="lbl" for="email">Email</label>
            <div class="field">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" inputmode="email" spellcheck="false">
            </div>
          </div>
          <div class="group">
            <label class="lbl" for="pw">Password</label>
            <div class="field">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
              <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
              <button class="eyebtn" id="eye" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1M3 3l18 18M10 10a3 3 0 0 0 4 4"/></svg>
              </button>
            </div>
          </div>
          <div class="row">
            <label class="check"><input type="checkbox" id="remember" checked><span class="box"><svg viewBox="0 0 12 12"><path d="m2 6.5 2.7 2.6L10 3"/></svg></span>Remember me</label>
            <a href="#" id="forgot">Forgot Password?</a>
          </div>
          <button class="btn" id="signin" type="submit">
            <span class="lab">Sign in</span><span class="spin"><i></i></span><span class="done">✓ Signed in</span>
          </button>
        </form>
      </div>

      <div class="msgwrap" id="msgwrap"><div><p class="msg" id="msg" role="alert" aria-live="polite"></p></div></div>

      <!-- WORKSPACE -->
      <div class="workspace fade" style="--d:1.9s">
        <h2>CHOOSE YOUR WORKSPACE</h2>
        <div class="wsgrid" id="wsgrid">
          <button class="ws" type="button" data-w="Customer" aria-pressed="true">Customer</button>
          <button class="ws" type="button" data-w="Vendor" aria-pressed="false">Vendor</button>
          <button class="ws" type="button" data-w="Business" aria-pressed="false">Business</button>
          <button class="ws" type="button" data-w="Agent" aria-pressed="false">Agent</button>
          <button class="ws" type="button" data-w="Admin" aria-pressed="false">Admin</button>
        </div>
        <p class="note">Sales Agents and Super Admins are invited by the platform — they cannot self-register.</p>
      </div>

      <p class="foot fade" style="--d:2.1s">New to VendorVerse? <a href="#" id="create">Create account</a></p>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let hostRequestId = 0;
  const requestHost = (type, detail = {}) => new Promise(resolve => {
    const requestId = ++hostRequestId;
    const onMessage = event => {
      if (event.source !== parent || event.origin !== location.origin || event.data?.source !== 'vv-approved-signin-host' || event.data.requestId !== requestId) return;
      removeEventListener('message', onMessage);
      resolve(event.data);
    };
    addEventListener('message', onMessage);
    parent.postMessage({ source: 'vv-approved-signin', type, requestId, ...detail }, location.origin);
  });

  /* ── Theme ── */
  let saved = null; try { saved = localStorage.getItem('vv-theme'); } catch(e){}
  const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'dark' : 'light';
  $('#theme').addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('vv-theme', next); } catch(e){}
  });

  /* ── Title: smooth letter-by-letter reveal, brand word gets a gradient ── */
  const title = $('#title'), text = title.textContent;
  const stops = [[249,115,22],[236,72,153],[139,92,246]];
  const grad = t => { const s = t*(stops.length-1), i = Math.min(Math.floor(s), stops.length-2), f = s-i;
    return 'rgb(' + stops[i].map((v,k)=>Math.round(v+(stops[i+1][k]-v)*f)).join() + ')'; };
  title.textContent = '';
  let idx = 0;
  text.split(' ').forEach(word => {
    const w = document.createElement('span');
    w.className = 'w' + (word === 'VendorVerse' ? ' brand' : '');
    w.setAttribute('aria-hidden','true');
    [...word].forEach((ch,k) => {
      const l = document.createElement('span');
      l.className = 'l'; l.textContent = ch; l.style.setProperty('--i', idx++);
      if (word === 'VendorVerse') l.style.setProperty('--c', grad(k/(word.length-1)));
      w.appendChild(l);
    });
    title.appendChild(w);
    idx += 1.5;
  });

  /* ── Scenery ── */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a={}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const flowers = $('#flowers'), grass = $('#grass');
  for (let i = 0; i < 26; i++) {
    const x = rnd()*1440, y = 290 + rnd()*115, s = .55 + rnd()*.6;
    const g = el('g', {transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(2)})`}, flowers);
    const sw = el('g', {class:'sway', style:`--s:${(3+rnd()*3).toFixed(1)}s;--d:${(-rnd()*4).toFixed(1)}s`}, g);
    el('path', {d:'M0 0q-2 16 0 30', stroke:'var(--grass)', 'stroke-width':3, fill:'none'}, sw);
    for (let k = 0; k < 6; k++) el('ellipse', {cx:0, cy:-9, rx:5.5, ry:9, fill:'#fff', stroke:'rgba(0,0,0,.08)', 'stroke-width':.8, transform:`rotate(${k*60})`}, sw);
    el('circle', {r:6, fill:'#ffc933'}, sw); el('circle', {r:2.6, fill:'#f59e0b'}, sw);
  }
  for (let i = 0; i < 34; i++) {
    const x = rnd()*1440, y = 300 + rnd()*115, s = .7 + rnd()*.9;
    const g = el('g', {transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(2)})`}, grass);
    el('path', {class:'sway', style:`--s:${(3+rnd()*3).toFixed(1)}s;--d:${(-rnd()*4).toFixed(1)}s`, d:'M0 0Q-3-14-7-22M0 0Q0-16 1-27M0 0Q4-12 9-20', stroke:'var(--grass)', 'stroke-width':2.6, fill:'none', 'stroke-linecap':'round'}, g);
  }
  const stars = $('#stars');
  for (let i = 0; i < 70; i++) { const s = document.createElement('i');
    s.style.cssText = `left:${rnd()*100}%;top:${rnd()*60}%;animation-delay:${-rnd()*3}s;animation-duration:${2+rnd()*3}s;opacity:${.4+rnd()*.6}`;
    if (rnd() > .85) { s.style.width = s.style.height = '3px'; } stars.appendChild(s); }

  /* ── Mascot behaviour ── */
  const mascot = $('#mascot'), head = $('#head'), pupils = $$('.pupil');
  const email = $('#email'), pw = $('#pw'), eye = $('#eye'), mobile = $('#mobile');
  const otpBoxes = $$('#otp input');
  let mode = 'idle';
  const look = (x, y) => {
    pupils.forEach(p => p.style.transform = `translate(${(x*4.2).toFixed(2)}px,${(y*3.6).toFixed(2)}px)`);
    head.style.transform = `translate(${(x*3).toFixed(2)}px,${(y*1.6).toFixed(2)}px) rotate(${(x*3.5).toFixed(2)}deg)`;
  };
  addEventListener('pointermove', e => {
    if (mode !== 'idle') return;
    const r = mascot.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height*.5;
    const c = v => Math.max(-1, Math.min(1, v));
    look(c((e.clientX-cx)/(innerWidth*.35)), c((e.clientY-cy)/(innerHeight*.45)));
  });
  const caretLook = (input, max) => () => {
    mode = 'type';
    const pos = input.selectionStart ?? input.value.length;
    look(-.85 + 1.7*Math.min(1, pos/max), .75);
  };
  const idle = () => { mode = 'idle'; look(0,0); };
  [[email,26],[mobile,14]].forEach(([inp,max]) => {
    ['focus','input','keyup','click'].forEach(ev => inp.addEventListener(ev, caretLook(inp, max)));
    inp.addEventListener('blur', idle);
  });
  otpBoxes.forEach((b, i) => {
    b.addEventListener('focus', () => { mode = 'type'; look(-.7 + 1.4*(i/5), .75); });
    b.addEventListener('blur', idle);
  });
  const cover = () => {
    mascot.classList.add('covering');
    mascot.classList.toggle('peeking', pw.type === 'text');
  };
  pw.addEventListener('focus', () => { mode = 'pw'; look(0,.2); cover(); });
  pw.addEventListener('blur',  () => { mode = 'idle'; mascot.classList.remove('covering','peeking'); look(0,0); });
  eye.addEventListener('mousedown', e => e.preventDefault());
  eye.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', show); eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    if (mode === 'pw') cover(); pw.focus();
  });

  /* ── Messages / helpers ── */
  const card = $('#card'), msg = $('#msg'), msgwrap = $('#msgwrap');
  const say = (t, kind) => { msg.className = 'msg ' + kind; msg.textContent = t; msgwrap.classList.add('show'); };
  const clear = () => {
    msgwrap.classList.remove('show'); mascot.classList.remove('sad');
    $$('[data-invalid]').forEach(e => e.removeAttribute('data-invalid'));
    $$('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
  };
  const fail = text => {
    say(text, 'err');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    mascot.classList.remove('covering','peeking','sad'); void mascot.getBoundingClientRect(); mascot.classList.add('sad');
  };
  const burst = anchor => {
    if (reduce) return;
    const r = anchor.getBoundingClientRect(), cols = ['#f97316','#ec4899','#8b5cf6','#22c55e','#facc15','#38bdf8'];
    for (let i = 0; i < 34; i++) {
      const c = document.createElement('i'); c.className = 'confetti';
      const a = Math.random()*Math.PI*2, d = 120 + Math.random()*220;
      c.style.cssText = `left:${r.left + r.width/2}px;top:${r.top}px;background:${cols[i%cols.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d - 120 + 260}px;--r:${Math.random()*720-360}deg`;
      document.body.appendChild(c); setTimeout(() => c.remove(), 1500);
    }
  };
  const success = (btn, text, onDone) => {
    btn.classList.remove('loading'); btn.classList.add('ok');
    say(text, 'ok'); mascot.classList.add('happy'); burst(btn);
    setTimeout(() => { btn.disabled = false; btn.classList.remove('ok'); mascot.classList.remove('happy'); onDone?.(); }, 3200);
  };
  const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
  [email, pw, mobile, ...otpBoxes].forEach(i => i.addEventListener('input', () => { if (mascot.classList.contains('sad') || msg.classList.contains('err')) clear(); }));

  /* ── Workspace ── */
  let workspace = 'Customer';
  $$('.ws').forEach(b => b.addEventListener('click', () => {
    $$('.ws').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); workspace = b.dataset.w; clear();
  }));

  /* ── Tabs ── */
  const tabs = $$('.tab');
  const showTab = which => {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.id === 'tab-' + which)));
    $('#pane-phone').hidden = which !== 'phone';
    $('#pane-email').hidden = which !== 'email';
    clear(); idle(); mascot.classList.remove('covering','peeking');
  };
  tabs.forEach(t => {
    t.addEventListener('click', () => showTab(t.id.replace('tab-', '')));
    t.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const o = tabs.find(x => x !== t); o.focus(); o.click(); }
    });
  });

  /* ── Phone + OTP ── */
  const cc = $('#cc'), stepPhone = $('#stepPhone'), stepOtp = $('#stepOtp');
  const sendBtn = $('#sendOtp'), verifyBtn = $('#verify'), resend = $('#resend'), timerEl = $('#timer');
  let tInt;
  mobile.addEventListener('input', () => { mobile.value = mobile.value.replace(/[^\d ]/g, ''); });

  const startTimer = () => {
    let s = 30; resend.disabled = true; clearInterval(tInt);
    const tick = () => { timerEl.textContent = s > 0 ? `Resend in ${s}s` : ''; if (s <= 0) { resend.disabled = false; clearInterval(tInt); } s--; };
    tick(); tInt = setInterval(tick, 1000);
  };

  $('#phoneForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (sendBtn.disabled) return;
    const need = +cc.selectedOptions[0].dataset.len;
    const digits = mobile.value.replace(/\D/g, '');
    if (digits.length !== need) { clear(); $('#phoneBox').dataset.invalid = 'true'; fail(`Enter a valid ${need}-digit mobile number.`); mobile.focus(); mascot.classList.add('sad'); return; }
    clear(); sendBtn.disabled = true; sendBtn.classList.add('loading'); mobile.blur();
    const result = await requestHost('send-otp', { workspace, countryCode: cc.value, phone: digits });
    if (!result.ok) { sendBtn.classList.remove('loading'); sendBtn.disabled = false; fail(result.error || 'Could not send the OTP. Please try again.'); return; }
      sendBtn.classList.remove('loading'); sendBtn.disabled = false;
      stepPhone.hidden = true; stepOtp.hidden = false;
      $('#sentTo').textContent = `${cc.value} ${mobile.value.trim()}`;
      otpBoxes.forEach(b => b.value = ''); otpBoxes[0].focus();
      say('OTP sent. Enter the 6-digit code.', 'info'); startTimer();
  });

  otpBoxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      b.value = b.value.replace(/\D/g, '').slice(-1);
      if (b.value && i < 5) otpBoxes[i + 1].focus();
    });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && i > 0) otpBoxes[i - 1].focus();
      if (e.key === 'Enter') { e.preventDefault(); verifyBtn.click(); }
    });
    b.addEventListener('paste', e => {
      const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      if (!t) return; e.preventDefault();
      [...t].forEach((c, k) => otpBoxes[k].value = c);
      otpBoxes[Math.min(t.length, 5)].focus();
    });
  });

  $('#changeNum').addEventListener('click', () => { clearInterval(tInt); stepOtp.hidden = true; stepPhone.hidden = false; clear(); mobile.focus(); });
  resend.addEventListener('click', async () => {
    const result = await requestHost('send-otp', { workspace, countryCode: cc.value, phone: mobile.value.replace(/\D/g, '') });
    if (!result.ok) { fail(result.error || 'Could not resend the OTP. Please try again.'); return; }
    clear(); say('A new OTP has been sent.', 'info'); otpBoxes.forEach(b => b.value = ''); otpBoxes[0].focus(); startTimer();
  });

  verifyBtn.addEventListener('click', async () => {
    if (verifyBtn.disabled) return;
    const code = otpBoxes.map(b => b.value).join('');
    if (code.length !== 6) { fail('Enter the complete 6-digit OTP.'); return; }
    clear(); verifyBtn.disabled = true; verifyBtn.classList.add('loading'); document.activeElement.blur();
    const result = await requestHost('verify-otp', { workspace, countryCode: cc.value, phone: mobile.value.replace(/\D/g, ''), code });
    if (!result.ok) { verifyBtn.disabled = false; verifyBtn.classList.remove('loading'); fail(result.error || 'The OTP could not be verified.'); return; }
    success(verifyBtn, `Welcome to VendorVerse! Opening your ${workspace} workspace…`, () => {
      requestHost('complete-sign-in', { workspace, method: 'phone', countryCode: cc.value, phone: mobile.value.replace(/\D/g, '') });
    });
  });

  /* ── Email form ── */
  const signin = $('#signin');
  $('#emailForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (signin.disabled) return;
    const okE = emailOk(email.value), okP = pw.value.length >= 4;
    clear();
    if (!okE) email.setAttribute('aria-invalid','true');
    if (!okP) pw.setAttribute('aria-invalid','true');
    if (!okE || !okP) { fail('Please enter a valid email and password.'); (okE ? pw : email).focus(); mascot.classList.add('sad'); return; }
    signin.disabled = true; signin.classList.add('loading'); pw.blur();
    const result = await requestHost('sign-in-email', { workspace, email: email.value.trim(), password: pw.value });
    if (!result.ok) { signin.disabled = false; signin.classList.remove('loading'); fail(result.error || 'Sign-in failed. Please try again.'); return; }
    success(signin, `Welcome to VendorVerse! Opening your ${workspace} workspace…`, () => {
      requestHost('complete-sign-in', { workspace, method: 'email', email: email.value.trim() });
    });
  });

  $('#forgot').addEventListener('click', async e => { e.preventDefault(); clear();
    if (!emailOk(email.value)) { say("Enter your email above and we'll send a reset link.", 'info'); return; }
    const result = await requestHost('forgot-password', { email: email.value.trim() });
    say(result.error || `We'll send a reset link to ${email.value.trim()}.`, 'info'); });
  $('#create').addEventListener('click', e => { e.preventDefault(); requestHost('create-account', { workspace }); });
  $$('.ws').forEach(b => b.addEventListener('click', () => requestHost('workspace-change', { workspace })));
})();
</script>
</body>
</html>
